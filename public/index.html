<!DOCTYPE html>
<html>

<title>EasyPay</title>
<style>
*{box-sizing:border-box}
body{background:#03050A;color:#0B0E14;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0}
.container{padding:16px 16px 110px;max-width:520px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px}
.logo{font-size:30px;font-weight:900;color:#fff;letter-spacing:-.5px}
.logo span{background:linear-gradient(135deg,#2E7DFF,#00E5FF,#7C4DFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2E7DFF,#7C4DFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(124,77,255,.6);font-size:19px;border:2px solid rgba(255,255,255,.3)}
.greet{color:#8A94A6;font-size:13px;margin:6px 0 0 4px;line-height:1.4}
.greet b{color:#fff;font-size:21px;line-height:1.2}
.card{background:linear-gradient(180deg,#F2F4F7,#EDEFF2);border-radius:28px;padding:20px;margin-top:14px;box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.card-dark{background:linear-gradient(135deg,#0B1220 0%,#142A5E 40%,#2E7DFF 75%,#7C4DFF 100%);color:#fff;border-radius:30px;padding:22px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(46,125,255,.5)}
.card-dark:after{content:"";position:absolute;right:-30px;top:-30px;width:170px;height:170px;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);border-radius:50%}
.card-dark:before{content:"";position:absolute;left:-20px;bottom:-60px;width:140px;height:140px;background:radial-gradient(circle,rgba(0,229,255,.35),transparent 70%);border-radius:50%}
.balance-label{color:#C5D6FF;font-size:11px;letter-spacing:1.8px;font-weight:800}
.balance-big{font-size:40px;font-weight:900;margin:6px 0 2px;letter-spacing:-.5px;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.balance-big span{font-size:18px;color:#7FB2FF}
.small{color:#5A6472;font-size:12px;line-height:1.5}
.small-light{color:#D6E2FF;font-size:12px}
.pill-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.2);color:#fff;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:700;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)}
.chip-green{background:rgba(0,200,83,.9)}

button:active{transform:scale(.97);box-shadow:0 4px 10px rgba(46,125,255,.3)}
button:after{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
button:hover:after{left:120%;transition:.6s}
button.secondary{background:#fff;color:#0B0E14;border:1.5px solid #D6DAE0;box-shadow:0 6px 14px rgba(0,0,0,.08),inset 0 1px 0 #fff}
